<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daves LightGens Shop</title>
  <!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2
family=Inter:wght@400;600;700;800;900&family=Press+Start+2P&display=swap"
rel="stylesheet">
  <style>
:root {
/* Slightly prettier palette (no text changes needed) */
--bg: #0a0f1b;
--panel: #111a30;
  /* "White" surfaces now a softer, fitting tint instead of stark white */
--surface: rgba(210, 225, 255, .07);
--surface2: rgba(210, 225, 255, .10);
  --border: rgba(255,255,255,.12);
  /* Text slightly lighter for better contrast on dark UI */
--text: rgba(244, 247, 255, .94);
--muted: rgba(214, 222, 245, .74);
  --accent:#b35cff;
--accent2:#3ee1ff;
--good:#46f2a3;
--warn:#ffcc66;
  --glow: 0 0 0 2px rgba(179,92,255,.30), 0 0 28px rgba(179,92,255,.18);
}
  * { box-sizing:border-box; }
  body {
margin:0;    font-family:Inter,system-ui;
background:
radial-gradient(1200px 700px at 18% 0%, rgba(179,92,255,.22), transparent 55%),
radial-gradient(900px 600px at 85% 10%, rgba(62,225,255,.16), transparent 52%),
radial-gradient(900px 650px at 55% 110%, rgba(70,242,163,.09), transparent 55%),
linear-gradient(180deg, #0a0f1b 0%, #070b14 100%);
color:var(--text);
}
.wrap {
max-width:1200px;
margin:auto;
padding:28px 18px 60px;
}
/* Header */
.topbar {
display:flex;
align-items:center;
gap:14px;
margin-bottom:22px;
}
.logo {
width:48px;
height:48px;
border-radius:14px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
display:grid;
place-items:center;
font-family:"Press Start 2P";
font-size:14px;
box-shadow:var(--glow);
border: 1px solid rgba(255,255,255,.16);
}
h1 {
margin:0;
font-size:22px;
font-weight:900;
letter-spacing:.2px;
}     .subtitle {
color:var(--muted);
font-size:14px;
font-weight:700;
}
/* Panel */
.panel {
background:
radial-gradient(900px 420px at 25% 0%, rgba(179,92,255,.10), transparent 60%),
radial-gradient(900px 420px at 85% 0%, rgba(62,225,255,.08), transparent 60%),
linear-gradient(180deg, rgba(18, 26, 48, .92) 0%, rgba(11, 16, 32, .92) 100%);
border:1px solid var(--border);
border-radius:18px;
box-shadow: 0 18px 45px rgba(0,0,0,.45);
overflow:hidden;
backdrop-filter: blur(10px);
}
/* Controls */
.controls {
padding:14px;
display:grid;
grid-template-columns:1.4fr .8fr .8fr;
gap:10px;
border-bottom:1px solid var(--border);
background: linear-gradient(180deg, rgba(210,225,255,.05), rgba(210,225,255,.02));
}
.field {
background: linear-gradient(180deg, var(--surface2), var(--surface));
border:1px solid rgba(255,255,255,.14);
border-radius:14px;
padding:10px 12px;
box-shadow: 0 10px 24px rgba(0,0,0,.18);
}
.field input,
.field select {
width:100%;
background:none;       border:0;
outline:0;
color:var(--text);
font-weight:800;
}
.field input::placeholder {
color: rgba(214, 222, 245, .62);
}
/* Grid */
.content { padding:14px; }
.grid {
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}
@media(max-width:900px){
.grid { grid-template-columns:repeat(2,1fr); }
.controls { grid-template-columns:1fr 1fr; }
}
@media(max-width:560px){
.grid { grid-template-columns:1fr; }
.controls { grid-template-columns:1fr; }
}
/* Card */
.card {
position:relative;
background: linear-gradient(180deg, var(--surface2), rgba(210,225,255,.05));
border:1px solid rgba(255,255,255,.14);
border-radius:16px;
padding:14px;
padding-bottom:56px;
box-shadow: 0 16px 38px rgba(0,0,0,.22);
}
.badges {
display:flex;     gap:8px;
flex-wrap:wrap;
margin-bottom:8px;
}
.badge {
padding:6px 10px;
border-radius:999px;
font-size:12px;
font-weight:900;
border:1px solid rgba(255,255,255,.14);
background: rgba(210,225,255,.06);
box-shadow: 0 10px 22px rgba(0,0,0,.16);
}
.legendary { color: rgba(233, 215, 255, .98); }
.available { color: rgba(70, 242, 163, .98); }
.category { color: rgba(255, 204, 102, .98); }
.name {
font-size:16px;
font-weight:1000;
margin:4px 0 6px;
}
.priceLine {
color:var(--muted);
font-weight:800;
font-size:13px;
}
.units {
position:absolute;
left:12px;
bottom:12px;
font-size:12px;
font-weight:900;
padding:7px 10px;
border-radius:999px;
border:1px solid rgba(255,255,255,.14);
background: rgba(210,225,255,.06);
color: rgba(244, 247, 255, .86);box-shadow: 0 10px 22px rgba(0,0,0,.16);
white-space:nowrap;
}
  .price {
position:absolute;
right:12px;
bottom:12px;
font-size:14px;
font-weight:1000;
padding:8px 12px;
border-radius:12px;
background: rgba(179,92,255,.18);
border:1px solid rgba(255,255,255,.14);
box-shadow: 0 10px 22px rgba(0,0,0,.16);
white-space:nowrap;
}
</style>
</head>
 <body>
<div class="wrap">
  <div class="topbar">
<div class="logo">LG</div>
<div>
<h1>Daves LightGens Shop</h1>
<div class="subtitle">Browse Legendary items • Contact DaveL0L to purchase</div>
</div>
</div>
  <div class="panel">
<div class="controls">
<div class="field">
<input id="search" placeholder="Search items...">
</div>
<div class="field">
<select id="category">
<option value="all">All Categories</option>
<option value="Key">Key</option>
<option value="Armor">Armor</option>
<option value="Weapons">Weapons</option><option value="Utility">Utility</option>
</select>
</div>
<div class="field">
<select id="sort">
<option value="priceDesc">Price ↓</option>
<option value="priceAsc">Price ↑</option>
</select>
</div>
</div>
  <div class="content">
<div id="grid" class="grid"></div>
</div>
</div>
 </div>
 <script>
const ITEMS = [
{name:"Legendary Key",cat:"Key",price:250000,units:17},
{name:"Legendary Helmet",cat:"Armor",price:50000,units:11},
{name:"Legendary Chestplate",cat:"Armor",price:80000,units:10},
{name:"Legendary Leggings",cat:"Armor",price:70000,units:11},
{name:"Legendary Boots",cat:"Armor",price:50000,units:12},
{name:"Legendary Sword",cat:"Weapons",price:150000,units:7},
{name:"Legendary Axe",cat:"Weapons",price:120000,units:2},
{name:"Legendary Bow",cat:"Weapons",price:200000,units:3},
{name:"Legendary Crossbow",cat:"Weapons",price:150000,units:1},
{name:"Legendary Trident",cat:"Weapons",price:200000,units:3},
{name:"Legendary Mace",cat:"Weapons",price:800000,units:1},
{name:"Totem",cat:"Utility",price:30000,units:81},
{name:"Beacon",cat:"Utility",price:50000,units:3},
{name:"Elytra",cat:"Utility",price:100000,units:54},
{name:"Shulker Box",cat:"Utility",price:50000,units:15}
];
 const grid = document.getElementById("grid");
const search = document.getElementById("search");
const category = document.getElementById("category");
const sort = document.getElementById("sort");
function render(){
let list = [...ITEMS];
  if (search.value) {
const q = search.value.toLowerCase();
list = list.filter(i => i.name.toLowerCase().includes(q));
}
  if (category.value !== "all") {
list = list.filter(i => i.cat === category.value);
}
  list.sort((a,b) => sort.value === "priceAsc" ? a.price - b.price : b.price - a.price);
  grid.innerHTML = "";
list.forEach(i => {
const el = document.createElement("div");
el.className = "card";
el.innerHTML = `
<div class="badges">
<span class="badge legendary">Legendary</span>
<span class="badge available">Available</span>
<span class="badge category">${i.cat}</span>
</div>
<div class="name">${i.name}</div>
<div class="priceLine">Price: ${i.price.toLocaleString()} gems</div>
<div class="units">${i.units} units</div>
<div class="price">${i.price.toLocaleString()} 💎</div>
`;
grid.appendChild(el);
});
}
 search.addEventListener("input", render);
category.addEventListener("change", render);
sort.addEventListener("change", render);
 render();
</script>
</body>
</html>
