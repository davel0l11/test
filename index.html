// ===== Modal (Purchase Contact) =====
const CONTACT_TEXT = "Contact DaveL0L on Discord/ingame.";
function openModal(item){
state.selected = item;
$("#mTitle").textContent = "Purchase Item";
$("#mSubtitle").textContent = "How to buy";
$("#mItem").textContent = item.item;
$("#mPrice").textContent = `${money(item.price)} gems`;
$("#mCategory").textContent = item.category;
$("#mUnits").textContent = `${money(item.units)}`;
$("#mContact").innerHTML = `Contact <b>DaveL0L</b> on <b>Discord</b> /
const overlay = $("#modalOverlay");
overlay.classList.add("show");
overlay.setAttribute("aria-hidden", "false");
}
function closeModal(){
state.selected = null;
const overlay = $("#modalOverlay");
overlay.classList.remove("show");
overlay.setAttribute("aria-hidden", "true");
}
$("#modalOverlay").addEventListener("click", (e) => {
if (e.target.id === "modalOverlay") closeModal();
});
$("#closeModal").addEventListener("click", closeModal);        $("#copyContact").addEventListener("click", () => {
copy(CONTACT_TEXT, "Contact copied!");
});
$("#copyOrder").addEventListener("click", () => {
if (!state.selected) return;
const x = state.selected;
const msg = `Hi DaveL0L, I want to buy: ${x.item} for ${money(x.price)} gems.`;
copy(msg, "Order message copied!");
});
// ===== Wire controls =====
$("#search").addEventListener("input", (e) => { state.search = e.target.value; render(); });
$("#rarity").addEventListener("change", (e) => { state.rarity = e.target.value; render(); });
$("#status").addEventListener("change", (e) => { state.status = e.target.value; render(); });
$("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
function resetAll(){
state.category = "All";
state.search = "";
state.rarity = "all";
state.status = "all";
state.sort = "priceDesc";
$("#search").value = "";
$("#rarity").value = "all";
$("#status").value = "all";
$("#sort").value = "priceDesc";
render();
toast("Reset!");
}
$("#resetBtn").addEventListener("click", resetAll);
// shortcuts
window.addEventListener("keydown", (e) => {
if (e.key === "Escape") closeModal();
if (e.key.toLowerCase() === "r" && !e.ctrlKey && !e.metaKey && !e.altKey) resetAll();
});
// init
buildFilters();
render();
