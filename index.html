<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daves Gem Exchange</title>
  <!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2
family=Inter:wght@400;600;700;800;900&family=Press+Start+2P&display=swap"
rel="stylesheet">
  <style>
/* 🔒 HARD LOCK DARK BACKGROUND */
html, body {
margin: 0;
padding: 0;
background: #070b14;
color-scheme: dark;
}
  :root {
--bg:#070b14;
--panel:#0f162b;
--surface: rgba(200,220,255,.07);
--surface2: rgba(200,220,255,.10);
--border: rgba(255,255,255,.12);
--text: rgba(245,248,255,.96);
--muted: rgba(214,222,245,.78);
--accent:#b35cff;
--accent2:#3ee1ff;
--good:#46f2a3;
--warn:#ffcc66;
--glow: 0 0 0 2px rgba(179,92,255,.30), 0 0 28px rgba(179,92,255,.18);
}
  * { box-sizing:border-box; }
  body {
font-family:Inter,system-ui;    background:
radial-gradient(1200px 700px at 18% 0%, rgba(179,92,255,.22), transparent 55%),
radial-gradient(900px 600px at 85% 10%, rgba(62,225,255,.16), transparent 52%),
linear-gradient(180deg, #070b14 0%, #05080f 100%);
color:var(--text);
min-height:100vh;
}
.wrap {
max-width:1200px;
margin:auto;
padding:28px 18px 60px;
}
/* Header */
.topbar {
display:flex;
align-items:center;
gap:14px;
margin-bottom:22px;
}
.logo {
width:48px;
height:48px;
border-radius:14px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
display:grid;
place-items:center;
font-family:"Press Start 2P";
font-size:14px;
box-shadow:var(--glow);
border:1px solid rgba(255,255,255,.16);
}
h1 {
margin:0;
font-size:22px;
font-weight:900;
letter-spacing:.2px;
}
    .subtitle {
color:var(--muted);
font-size:14px;
font-weight:700;
}
/* Panel */
.panel {
background:
radial-gradient(900px 420px at 25% 0%, rgba(179,92,255,.10), transparent 60%),
radial-gradient(900px 420px at 85% 0%, rgba(62,225,255,.08), transparent 60%),
linear-gradient(180deg, rgba(15,22,43,.96), rgba(8,12,24,.96));
border:1px solid var(--border);
border-radius:18px;
box-shadow:0 18px 45px rgba(0,0,0,.55);
overflow:hidden;
}
/* Controls */
.controls {
padding:14px;
display:grid;
grid-template-columns:1.4fr .8fr .8fr;
gap:10px;
border-bottom:1px solid var(--border);
background: linear-gradient(180deg, rgba(200,220,255,.05), rgba(200,220,255,.02));
}
.field {
background: linear-gradient(180deg, var(--surface2), var(--surface));
border:1px solid rgba(255,255,255,.14);
border-radius:14px;
padding:10px 12px;
}
.field input,
.field select {
width:100%;
background:none;
border:0;
outline:0;
color:var(--text);       font-weight:800;
}
.field input::placeholder {
color: rgba(214,222,245,.62);
}
/* Grid */
.content { padding:14px; }
.grid {
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}
@media(max-width:900px){
.grid { grid-template-columns:repeat(2,1fr); }
.controls { grid-template-columns:1fr 1fr; }
}
@media(max-width:560px){
.grid { grid-template-columns:1fr; }
.controls { grid-template-columns:1fr; }
}
/* Card */
.card {
position:relative;
background: linear-gradient(180deg, var(--surface2), rgba(200,220,255,.05));
border:1px solid rgba(255,255,255,.14);
border-radius:16px;
padding:14px;
padding-bottom:56px;
box-shadow:0 16px 38px rgba(0,0,0,.32);
}
.badges {
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:8px;      }
.badge {
padding:6px 10px;
border-radius:999px;
font-size:12px;
font-weight:900;
border:1px solid rgba(255,255,255,.14);
background: rgba(200,220,255,.06);
}
.legendary { color:#ecdfff; }
.available { color:var(--good); }
.category { color:var(--warn); }
.name {
font-size:16px;
font-weight:1000;
margin:4px 0 6px;
}
.priceLine {
color:var(--muted);
font-weight:800;
font-size:13px;
}
.units {
position:absolute;
left:12px;
bottom:12px;
font-size:12px;
font-weight:900;
padding:7px 10px;
border-radius:999px;
border:1px solid rgba(255,255,255,.14);
background: rgba(200,220,255,.06);
}
.price {
position:absolute;
right:12px;bottom:12px;
font-size:14px;
font-weight:1000;
padding:8px 12px;
border-radius:12px;
background: rgba(179,92,255,.22);
border:1px solid rgba(255,255,255,.14);
}
</style>
</head>
 <body>
<div class="wrap">
  <div class="topbar">
<div class="logo">LG</div>
<div>
<h1>Daves LightGens Shop</h1>
<div class="subtitle">Browse Legendary items • Contact DaveL0L to purchase</div>
</div>
</div>
  <div class="panel">
<div class="controls">
<div class="field">
<input id="search" placeholder="Search items...">
</div>
<div class="field">
<select id="category">
<option value="all">All Categories</option>
<option value="Key">Key</option>
<option value="Armor">Armor</option>
<option value="Weapons">Weapons</option>
<option value="Utility">Utility</option>
</select>
</div>
<div class="field">
<select id="sort">
<option value="priceDesc">Price ↓</option>
<option value="priceAsc">Price ↑</option>
</select>
</div></div>
  <div class="content">
<div id="grid" class="grid"></div>
</div>
</div>
 </div>
 <script>
const ITEMS = [
{name:"Legendary Key",cat:"Key",price:250000,units:31},
{name:"Legendary Helmet",cat:"Armor",price:50000,units:16},
{name:"Legendary Chestplate",cat:"Armor",price:80000,units:15},
{name:"Legendary Leggings",cat:"Armor",price:70000,units:16},
{name:"Legendary Boots",cat:"Armor",price:50000,units:17},
{name:"Legendary Sword",cat:"Weapons",price:200000,units:7},
{name:"Legendary Axe",cat:"Weapons",price:150000,units:2},
{name:"Legendary Bow",cat:"Weapons",price:200000,units:3},
{name:"Legendary Crossbow",cat:"Weapons",price:150000,units:1},
{name:"Legendary Trident",cat:"Weapons",price:200000,units:3},
{name:"Legendary Mace",cat:"Weapons",price:750000,units:3},
{name:"Totem",cat:"Utility",price:30000,units:81},
{name:"Beacon",cat:"Utility",price:50000,units:3},
{name:"Elytra",cat:"Utility",price:100000,units:46},
{name:"Shulker Box",cat:"Utility",price:50000,units:26}
];
 const grid = document.getElementById("grid");
const search = document.getElementById("search");
const category = document.getElementById("category");
const sort = document.getElementById("sort");
 function render(){
let list=[...ITEMS];
  if(search.value){
const q=search.value.toLowerCase();
list=list.filter(i=>i.name.toLowerCase().includes(q));
}
  if(category.value!=="all"){list=list.filter(i=>i.cat===category.value);
}
  list.sort((a,b)=>sort.value==="priceAsc"?a.price-b.price:b.price-a.price);
  grid.innerHTML="";
list.forEach(i=>{
const el=document.createElement("div");
el.className="card";
el.innerHTML=`
<div class="badges">
<span class="badge legendary">Legendary</span>
<span class="badge available">Available</span>
<span class="badge category">${i.cat}</span>
</div>
<div class="name">${i.name}</div>
<div class="priceLine">Price: ${i.price.toLocaleString()} gems</div>
<div class="units">${i.units} units</div>
<div class="price">${i.price.toLocaleString()} 💎</div>
`;
grid.appendChild(el);
});
}
 search.addEventListener("input",render);
category.addEventListener("change",render);
sort.addEventListener("change",render);
 render();
</script>
</body>
</html>
